name: Paid
description: 'Paid (paid.ai) is the monetization platform for AI agents. It gives teams
  that build and sell AI agents the pricing, billing, and margin infrastructure to
  charge with flexible models — credits, usage-based, seat-based, and outcome-based
  pricing — while tracking the AI costs and delivered value behind every customer.
  Paid exposes a REST API (v1 and v2 on api.agentpaid.io), first-party SDKs for Node,
  Python, Go, and Java, a CLI, embeddable UI components, billing webhooks, an agent
  skill, and a hosted MCP server. Backed by EQT Ventures, Lightspeed Venture Partners,
  Seedcamp, and Techstars.'
