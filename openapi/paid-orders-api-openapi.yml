components:
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: string
        externalId:
          type: string
        organizationId:
          type: string
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        agentCode:
          type: string
        agentAttributes:
          type: array
          items:
            $ref: '#/components/schemas/AgentAttribute'
      required:
      - id
      - organizationId
      - name
      - active
      title: Agent
    PricingModelType:
      type: string
      enum:
      - PerUnit
      - VolumePricing
      - GraduatedPricing
      - PrepaidCredits
      title: PricingModelType
    Customer:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        externalId:
          type: string
        phone:
          type: string
        employeeCount:
          type: number
          format: double
        annualRevenue:
          type: number
          format: double
        taxExemptStatus:
          $ref: '#/components/schemas/TaxExemptStatus'
        creationSource:
          $ref: '#/components/schemas/CreationSource'
        creationState:
          $ref: '#/components/schemas/CreationState'
        website:
          type: string
        billingAddress:
          $ref: '#/components/schemas/Address'
        metadata:
          $ref: '#/components/schemas/CustomerMetadata'
          description: Flexible JSON field for storing custom metadata about the customer
      required:
      - id
      - organizationId
      - name
      title: Customer
    CreateOrderLineAttributeRequestPricingBillingFrequency:
      type: string
      enum:
      - monthly
      - quarterly
      - semiAnnually
      - annual
      - custom
      title: CreateOrderLineAttributeRequestPricingBillingFrequency
    OrderCreationState:
      type: string
      enum:
      - draft
      - active
      title: OrderCreationState
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayId:
          type: string
          description: Human-readable invoice number
        organizationId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        currency:
          type: string
        subtotal:
          type: number
          format: double
          description: Total before tax (in smallest currency unit)
        tax:
          type: number
          format: double
          description: Tax amount (in smallest currency unit)
        total:
          type: number
          format: double
          description: Total amount including tax (in smallest currency unit)
        amountPaid:
          type: number
          format: double
          description: Amount already paid (in smallest currency unit)
