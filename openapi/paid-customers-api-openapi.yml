components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        externalId:
          type: string
        phone:
          type: string
        employeeCount:
          type: number
          format: double
        annualRevenue:
          type: number
          format: double
        taxExemptStatus:
          $ref: '#/components/schemas/TaxExemptStatus'
        creationSource:
          $ref: '#/components/schemas/CreationSource'
        creationState:
          $ref: '#/components/schemas/CreationState'
        website:
          type: string
        billingAddress:
          $ref: '#/components/schemas/Address'
        metadata:
          $ref: '#/components/schemas/CustomerMetadata'
          description: Flexible JSON field for storing custom metadata about the customer
      required:
      - id
      - organizationId
      - name
      title: Customer
    UsageSummaryOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayId:
          type:
          - string
          - 'null'
      description: Associated order information
      title: UsageSummaryOrder
    StripeConnection:
      type: object
      properties:
        customerId:
          type: string
          description: Stripe customer ID.
      required:
      - customerId
      description: Stripe customer link, or null when no Stripe gateway account is configured.
      title: StripeConnection
    CustomerCreateMetadata:
      type: object
      properties: {}
      description: Flexible JSON field for storing custom metadata about the customer
      title: CustomerCreateMetadata
    EmptyResponse:
      type: object
      properties: {}
      title: EmptyResponse
    PaginationMeta:
      type: object
      properties:
        limit:
          type: integer
          description: The requested limit
        offset:
          type: integer
          description: The requested offset
        count:
          type: integer
          description: Number of items returned in this response
        hasMore:
          type: boolean
          description: Whether there are more results available
        startTime:
          type: string
          format: date-time
          description: The startTime filter that was applied (if any)
        endTime:
          type: string
          format: date-time
          description: The endTime filter that was applied (if any)
        externalCustomerId:
          type: string
          description: The externalCustomerId filter that was applied (if any)
        externalProductId:
          type: string
          description: The externalProductId filter that was applied (if any)
        externalAgentId:
          type: string
          description: 'DEPRECATED: Use externalProductId instead. The externalAgentId filter that was applied (if any)'
        metadata:
          type: string
          description: The metadata filter that was applied (if any)
      required:
      - limit
      - offset
      - count
      - hasMore
      description: Pagination metadata for cost traces
      title: PaginationMeta
    CreditGrantResult:
      type: object
      properties:
        amount:
          type: integer
        startsAt:
          type: string
          format: date-time
          description: When these credits become spendable, as an RFC3339 datetime with timezone.
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When these credits expire, as an RFC3339 datetime with timezone. Null when the credits do not expire.
        status:
          $ref: '#/components/schemas/CreditGrantResultStatus'
          description: Credit grants are active immediately when created.
      required:
      - amount
      - startsAt
      - expiresAt
      - status
      title: CreditGrantResult
    CustomerCreate:
      type: object
      properties:
        name:
          type: string
        externalId:
          type: string
        phone:
          type: string
        employeeCount:
          type: number
          format: double
        annualRevenue:
          type: number
          format: double
        taxExemptStatus:
          $ref: '#/components/schemas/TaxExemptStatus'
        creationSource:
          $ref: '#/components/schemas/CreationSource'
        website:
          type: string
        billingAddress:
          $ref: '#/components/schemas/Address'
        metadata:
          $ref: '#/components/schemas/CustomerCreateMetadata'
          description: Flexible JSON field for storing custom metadata about the customer
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactCreateForCustomer'
          description: Array of contacts to create for this customer
      required:
      - name
      title: CustomerCreate
    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
      required:
      - limit
      - offset
      - total
      - hasMore
      title: Pagination
    Salutation:
      type: string
      enum:
      - Mr.
      - Mrs.
      - Miss
      - Ms.
      - Dr.
      - Prof.
      title: Salutation
    CustomerStatus:
      type: string
      enum:
      - active
      - churned
      description: 'Customer status: churned when the customer is marked as churned, active otherwise.'
      title: CustomerStatus
    CustomerStateSeatStatus:
      type: string
      enum:
      - assigned
      - unassigned
      title: CustomerStateSeatStatus
    CustomerState:
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/CustomerStateCustomer'
        defaultCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/CustomerStateOrder'
        seats:
          $ref: '#/components/schemas/CustomerStateSeats'
        checkoutLinks:
          type: array
          items:
            $ref: '#/components/schemas/CustomerStateCheckoutLink'
        credits:
          $ref: '#/components/schemas/CustomerStateCreditSummary'
        timestamp:
          type: string
          format: date-time
      required:
      - customer
      - defaultCurrency
      - orders
      - seats
      - checkoutLinks
      - credits
      - timestamp
      title: CustomerState
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: string
      required:
      - error
      title: ErrorResponse
    CustomerStateSeats:
      type: object
      properties:
        total:
          type: integer
        assigned:
          type: integer
        unassigned:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerStateSeat'
      required:
      - total
      - assigned
      - unassigned
      - data
      title: CustomerStateSeats
    CustomerStateCheckoutLink:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        status:
          $ref: '#/components/schemas/CustomerStateCheckoutLinkStatus'
        productIds:
          type: array
          items:
            type: string
        singleUse:
          type: boolean
        allowedCurrencies:
          type: array
          items:
            type: string
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - url
      - status
      - productIds
      - singleUse
      - allowedCurrencies
      - expiresAt
      title: CustomerStateCheckoutLink
    CreateCustomerRequest:
      type: object
      properties:
        name:
          type: string
        legalName:
          type:
          - string
          - 'null'
        email:
          type: string
          format: email
        phone:
          type: string
        website:
          type: string
        externalId:
          type:
          - string
          - 'null'
        billingAddress:
          $ref: '#/components/schemas/CustomerBillingAddressInput'
        creationState:
          $ref: '#/components/schemas/CustomerCreationState'
        vatNumber:
          type:
          - string
          - 'null'
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            description: Any type
        defaultCurrency:
          type: string
      required:
      - name
      title: CreateCustomerRequest
    CustomerBillingAddressResponse:
      type: object
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
      description: Customer billing address, or null when no address is set.
      title: CustomerBillingAddressResponse
    CustomerStateSeat:
      type: object
      properties:
        id:
          type: string
          description: Seat UUID. Seats do not currently have display IDs; use this value as `{seatId}` with the order seat assignment endpoints.
        orderId:
          type: string
        product:
          $ref: '#/components/schemas/CustomerStateProductRef'
        status:
          $ref: '#/components/schemas/CustomerStateSeatStatus'
        assignee:
          $ref: '#/components/schemas/CustomerStateSeatAssignee'
        credits:
          $ref: '#/components/schemas/CustomerStateCreditSummary'
      required:
      - id
      - orderId
      - product
      - status
      - assignee
      - credits
      title: CustomerStateSeat
    CustomerStateCreditSummary:
      type: object
      properties:
        balances:
          type: array
          items:
            $ref: '#/components/schemas/CustomerStateCreditBalance'
      required:
      - balances
      title: CustomerStateCreditSummary
    CostTrace:
      type: object
      properties:
        name:
          type: string
          description: The name/type of the operation (e.g., "trace.openai.agents.on_agent")
        vendor:
          type: string
          description: The vendor/provider (e.g., "openai", "anthropic", "mistral")
        model:
          type: string
          description: The model used for the operation (e.g., "gpt-4o-mini", "claude-3-sonnet")
        cost:
          $ref: '#/components/schemas/CostAmount'
        startTimeUnixNano:
          type: string
          description: Unix timestamp in nanoseconds when the operation started
        endTimeUnixNano:
          type: string
          description: Unix timestamp in nanoseconds when the operation completed
        attributes:
          type: object
          additionalProperties:
            description: Any type
          description: Additional metadata about the trace (e.g., tokens, etc.)
      required:
      - name
      - vendor
      - cost
      - startTimeUnixNano
      - endTimeUnixNano
      - attributes
      description: A single cost trace record
      title: CostTrace
    UsageSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the usage summary
        eventName:
          type: string
          description: The name of the event being tracked
        eventsQuantity:
          type: integer
          format: int64
          description: The quantity of events in this usage period
        startDate:
          type: string
          format: date-time
          description: The start date of the usage period
        endDate:
          type: string
          format: date-time
          description: The end date of the usage period
        subtotal:
          type: integer
          format: int64
          description: The subtotal amount in the smallest currency unit (e.g., cents)
        nextBillingDate:
          type: string
          format: date-time
          description: The next billing date for this usage
        customerId:
          type: string
          format: uuid
          description: The internal customer ID
        orderId:
          type: string
          format: uuid
          description: The order ID associated with this usage
        orderLineId:
          type: string
          format: uuid
          description: The order line ID associated with this usage
        orderLineAttributeId:
          type: string
          format: uuid
          description: The order line attribute ID associated with this usage
        invoiceId:
          type:
          - string
          - 'null'
          format: uuid
          description: The invoice ID if this usage has been invoiced
        invoiceLineId:
          type:
          - string
          - 'null'
          format: uuid
          description: The invoice line ID if this usage has been invoiced
        createdAt:
          type: string
          format: date-time
          description: When the usage summary was created
        updatedAt:
          type: string
          format: date-time
          description: When the usage summary was last updated
        order:
          $ref: '#/components/schemas/UsageSummaryOrder'
          description: Associated order information
        orderLine:
          $ref: '#/components/schemas/UsageSummaryOrderLine'
          description: Associated order line information
      required:
      - id
      - eventName
      - eventsQuantity
      - startDate
      - endDate
      - subtotal
      - nextBillingDate
      - customerId
      - orderId
      - orderLineId
      - orderLineAttributeId
      - createdAt
      - updatedAt
      description: A single usage summary record
      title: UsageSummary
    CustomerUserStatus:
