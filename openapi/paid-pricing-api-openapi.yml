openapi: 3.2.0
info:
  title: Reference Pricing API
  version: 1.0.0
servers:
- url: https://api.agentpaid.io/api/v2
  description: Production API
tags:
- name: Pricing
paths:
  /pricing/:
    get:
      operationId: list-pricing
      summary: List pricing for a product
      description: Returns pricing for all product attributes of a product. Each entry includes the attribute's pricing configuration and credit benefits.
      tags:
      - Pricing
      parameters:
      - name: productId
        in: query
        description: Product display ID or UUID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: API Key authentication using Bearer token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingListResponse'
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '500'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pricing/{productAttributeId}:
    get:
      operationId: get-pricing
      summary: Get pricing for a product attribute
      description: Returns pricing and credit benefits for a single product attribute.
      tags:
      - Pricing
      parameters:
      - name: productAttributeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: API Key authentication using Bearer token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingResponse'
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '500'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: update-pricing
      summary: Update pricing for a product attribute
      description: Updates pricing on an existing product attribute. If creditBenefits is provided, it fully replaces existing benefits. If omitted, existing benefits are preserved.
      tags:
      - Pricing
      parameters:
      - name: productAttributeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: API Key authentication using Bearer token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingResponse'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '500'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePricingRequest'
components:
  schemas:
    UpdatePricingRequest:
      type: object
      properties:
        pricing:
          $ref: '#/components/schemas/PricingInput'
        creditBenefits:
          type: array
          items:
            $ref: '#/components/schemas/CreditBenefitInput'
      required:
      - pricing
      title: UpdatePricingRequest
    PricingOutputSignalType:
      type: string
      enum:
      - activity
      - outcome
      title: PricingOutputSignalType
    PricingInputDiscriminatorMappingUsagePrepaidCreditsSignalType:
      type: string
      enum:
      - activity
      - outcome
      title: PricingInputDiscriminatorMappingUsagePrepaidCreditsSignalType
    CreditBenefitInputRecipient:
      type: string
      enum:
      - organization
      - seat
      default: organization
      title: CreditBenefitInputRecipient
    PricingInputDiscriminatorMappingSeatBasedPerUnitBillingType:
      type: string
      enum:
      - Advance
      - Arrears
      default: Advance
      title: PricingInputDiscriminatorMappingSeatBasedPerUnitBillingType
    PricingInputDiscriminatorMappingRecurringGraduatedBillingFrequency:
      type: string
      enum:
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annual
      - Custom
      title: PricingInputDiscriminatorMappingRecurringGraduatedBillingFrequency
    PricingInputDiscriminatorMappingUsagePerUnitBillingType:
      type: string
      enum:
      - Advance
      - Arrears
      default: Arrears
      title: PricingInputDiscriminatorMappingUsagePerUnitBillingType
    PricingResponse:
      type: object
      properties:
        productAttributeId:
          type: string
        name:
          type: string
        pricing:
          $ref: '#/components/schemas/PricingOutput'
        creditBenefits:
          type: array
          items:
            $ref: '#/components/schemas/CreditBenefitOutput'
