      enum:
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annual
      - Custom
      title: PricingInputDiscriminatorMappingSeatBasedVolumeBillingFrequency
    PricingInputDiscriminatorMappingRecurringVolumeBillingFrequency:
      type: string
      enum:
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annual
      - Custom
      title: PricingInputDiscriminatorMappingRecurringVolumeBillingFrequency
    TieredPricePoint:
